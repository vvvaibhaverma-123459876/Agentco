openapi: 3.0.3
info:
  title: Agentco Governed API
  version: 0.1.0-phase3
  description: Governed API boundary for calibration and Institution Kernel mutations.
paths:
  /institutions:
    post:
      summary: Create an institution through the governed API.
      security:
        - ApiKey: []
      responses:
        "201":
          description: Institution created.
  /institutions/{id}:
    get:
      summary: Read an institution.
      responses:
        "200":
          description: Institution.
  /claims/register:
    post:
      summary: Register a calibration claim.
      security:
        - ApiKey: []
      responses:
        "201":
          description: Claim registered.
  /claims/{id}/resolve:
    post:
      summary: Resolve a calibration claim through governed resolution.
      security:
        - ApiKey: []
      responses:
        "200":
          description: Claim resolved.
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-agentco-api-key
