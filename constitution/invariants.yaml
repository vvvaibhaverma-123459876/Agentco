# AgentCo Architecture Constitution — invariant registry
# Governed by constitution/CONVENTIONS.md; validated by
# scripts/constitution/check_constitution.py on every push/PR.
#
# Example entry:
#   - id: V9-INV-004                     # V<volume>-INV-<3 digits>; never renumbered, never reused
#     statement: Claims promoted to memory retain provenance links to their evidence rows.
#     tier: statute                      # constitutional | statute | regulation | article | charter
#     status: enforced                   # enforced | planned | aspirational
#     enforcement:                       # REQUIRED when status: enforced — repo paths (or path::test name)
#       - backend/src/services/claim-grounding.service.ts
#       - backend/tests/claim-grounding.test.ts
#
invariants:
  - id: V0-INV-001
    statement: Every constitution volume conforms to TEMPLATE.md's sections and its header agrees with INDEX.md, checked automatically on every push and pull request.
    tier: constitutional
    status: enforced
    enforcement:
      - scripts/constitution/check_constitution.py
      - .github/workflows/constitution.yml
  - id: V0-INV-002
    statement: An invariant may carry status "enforced" only if it cites at least one enforcement path that exists in the repository.
    tier: constitutional
    status: enforced
    enforcement:
      - scripts/constitution/check_constitution.py
  - id: V0-INV-003
    statement: Civilization completion status is machine-derived from CIVILIZATION_BUILD_LEDGER.yaml and the generated report states the termination predicate explicitly instead of asserting completion in prose.
    tier: constitutional
    status: enforced
    enforcement:
      - scripts/generate_civilization_completion.py
      - .github/workflows/civilization-completion.yml
      - docs/civilization/OUTSTANDING_GATES.md
  - id: V0-INV-004
    statement: Human authority is root — a governed kill switch and an emergency-power path exist and are exercised by tests.
    tier: constitutional
    status: enforced
    enforcement:
      - backend/src/services/kill-switch.service.ts
      - backend/src/services/governance.service.ts
      - backend/tests/civilization-e2e-scenarios.test.ts
  - id: V0-INV-005
    statement: Civilization state changes append to tamper-evident logs, and kernel history plus decision-log tables reject in-place mutation at the database layer.
    tier: constitutional
    status: enforced
    enforcement:
      - backend/src/db/migrations/129_civilization_kernel.sql
      - backend/src/db/migrations/014_decision_log_immutability_triggers.sql
  - id: V0-INV-006
    statement: Every human-readable status surface is generated from a ledger rather than hand-edited, so no two status documents can disagree.
    tier: constitutional
    status: planned
  - id: V0-INV-007
    statement: A completion predicate may be set true only after the repository's canonical release gates have run green against the built code.
    tier: constitutional
    status: planned
  - id: V0-INV-008
    statement: AgentCo evolves its own architecture, institutions, and capabilities over time while preserving constitutional continuity, auditability, and human oversight.
    tier: constitutional
    status: aspirational
  - id: V0-INV-009
    statement: No permanent architectural component may exist solely for a specific knowledge domain or profession — domain expertise emerges through the capability, domain, institution, and knowledge-discovery frameworks (Domain Neutrality).
    tier: constitutional
    status: enforced
    enforcement:
      - scripts/constitution/check_constitution.py
  - id: V1-INV-001
    statement: Every decision is recorded in an append-only, hash-chained decision log whose rows reject UPDATE and DELETE at the database layer.
    tier: constitutional
    status: enforced
    enforcement:
      - backend/src/db/migrations/012_decision_log_chain.sql
      - backend/src/db/migrations/014_decision_log_immutability_triggers.sql
  - id: V1-INV-002
    statement: Civilization identity and lifecycle state change only through explicit transaction-scoped authorization, and every transition appends to kernel history.
    tier: constitutional
    status: enforced
    enforcement:
      - backend/src/db/migrations/129_civilization_kernel.sql
      - backend/src/services/civilization-kernel.service.ts
      - backend/tests/civilization-kernel.test.ts
  - id: V1-INV-003
    statement: The runtime constitution is versioned, content-hashed, and signed; its integrity is verifiable; and declared protected surfaces subject changes to immutability or vote requirements.
    tier: constitutional
    status: enforced
    enforcement:
      - backend/src/db/migrations/027_calibration_constitution.sql
      - backend/src/services/calibration-constitution.service.ts
      - backend/tests/calibration-constitution.test.ts
      - backend/tests/protected-surface-enforcer.test.ts
  - id: V1-INV-004
    statement: Emergency powers are time-bounded by schema constraint, their activation and revocation are governed recorded acts, and an activated kill switch stops governed run loops.
    tier: constitutional
    status: enforced
    enforcement:
      - backend/src/db/migrations/135_governance.sql
      - backend/src/services/kill-switch.service.ts
      - backend/src/services/run-guard.service.ts
      - backend/tests/civilization-e2e-scenarios.test.ts
  - id: V1-INV-005
    statement: An enacted statute changes runtime behaviour — policy enforcement is checked at execution time, not merely recorded.
    tier: constitutional
    status: enforced
    enforcement:
      - backend/src/services/policy-enforcement.service.ts
      - backend/tests/governance.test.ts
  - id: V1-INV-006
    statement: A change to a constitutional-tier volume without a recorded authorizing human fails CI (mechanical amendment gate).
    tier: constitutional
    status: planned
  - id: V1-INV-007
    statement: A statute that contradicts a protected invariant fails enactment, fail-closed (constitutionality validation at enactment time).
    tier: constitutional
    status: planned
  - id: V1-INV-008
    statement: Meta-governance may evolve the civilization's own constitutional processes, but human root authority and the protected-invariant mechanism remain outside the system's own amendment power.
    tier: constitutional
    status: aspirational
  - id: V32-INV-001
    statement: Every HTTP route is classified in the sensitivity matrix, and a contract test fails the build on unclassified or misclassified routes.
    tier: constitutional
    status: enforced
    enforcement:
      - backend/tests/route-auth-contract.test.ts
      - docs/audit/ROUTE_SENSITIVITY_MATRIX.md
  - id: V32-INV-002
    statement: A production-like start fails closed on missing or dev-default secrets in both the TypeScript and Python runtimes.
    tier: constitutional
    status: enforced
    enforcement:
      - backend/src/security.ts
      - backend/tests/security.test.ts
      - agentco_security/env_guard.py
  - id: V32-INV-003
    statement: Every outbound web fetch validates scheme and target against private and metadata ranges — including hostnames that resolve to private addresses — and re-validates every redirect hop.
    tier: constitutional
    status: enforced
    enforcement:
      - backend/src/adapters/url-safety.ts
      - backend/tests/red-team-corpus.test.ts
  - id: V32-INV-004
    statement: Fetched web content enters model prompts only inside untrusted fences accompanied by a rule that fenced content is evidence, never instructions.
    tier: constitutional
    status: enforced
    enforcement:
      - backend/src/adapters/url-safety.ts
      - backend/src/services/autonomy-action-planner.service.ts
      - backend/tests/prompt-injection-e2e.test.ts
  - id: V32-INV-005
    statement: Specialist HTTP activation is HMAC-authenticated, and production or staging refuses to sign with an unset or default shared secret.
    tier: constitutional
    status: enforced
    enforcement:
      - backend/src/services/team-activation.service.ts
      - backend/tests/team-activation.test.ts
  - id: V32-INV-006
    statement: Inter-service event envelopes are signed, and the signing keys are among the startup-guarded secrets.
    tier: constitutional
    status: enforced
    enforcement:
      - backend/src/services/event-bus.service.ts
      - backend/src/db/migrations/128_event_bus_outbox.sql
      - agentco_security/env_guard.py
  - id: V32-INV-007
    statement: Continuous integration scans every push for committed secrets.
    tier: constitutional
    status: enforced
    enforcement:
      - .github/workflows/ci.yml
  - id: V32-INV-008
    statement: Dependency vulnerability audits run as a wired, fail-closed release gate rather than ad-hoc commands.
    tier: constitutional
    status: planned
  - id: V32-INV-009
    statement: The URL-safety adapter has a dedicated unit suite covering literal, DNS-resolved, redirect, and v4-mapped bypass attempts.
    tier: constitutional
    status: planned
