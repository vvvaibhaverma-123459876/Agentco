    status: enforced
    enforcement:
      - backend/src/services/event-bus.service.ts
      - backend/src/db/migrations/128_event_bus_outbox.sql
      - agentco_security/env_guard.py
  - id: V32-INV-007
    statement: Continuous integration scans every push for committed secrets.
    tier: constitutional
    status: enforced
    enforcement:
      - .github/workflows/ci.yml
  - id: V32-INV-008
    statement: Dependency vulnerability audits run as a wired, fail-closed release gate rather than ad-hoc commands.
    tier: constitutional
    status: planned
  - id: V32-INV-009
    statement: The URL-safety adapter has a dedicated unit suite covering literal, DNS-resolved, redirect, and v4-mapped bypass attempts.
    tier: constitutional
    status: planned
