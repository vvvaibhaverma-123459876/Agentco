# AgentCo Architecture Constitution — invariant registry
# Governed by constitution/CONVENTIONS.md; validated by
# scripts/constitution/check_constitution.py on every push/PR.
#
# Example entry:
#   - id: V9-INV-004                     # V<volume>-INV-<3 digits>; never renumbered, never reused
#     statement: Claims promoted to memory retain provenance links to their evidence rows.
#     tier: statute                      # constitutional | statute | regulation | article | charter
#     status: enforced                   # enforced | planned | aspirational
#     enforcement:                       # REQUIRED when status: enforced — repo paths (or path::test name)
#       - backend/src/services/claim-grounding.service.ts
#       - backend/tests/claim-grounding.test.ts
#
