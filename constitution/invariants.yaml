    status: enforced
    enforcement:
      - backend/src/adapters/url-safety.ts
      - backend/src/services/autonomy-action-planner.service.ts
      - backend/tests/prompt-injection-e2e.test.ts
  - id: V32-INV-005
    statement: Specialist HTTP activation is HMAC-authenticated, and production or staging refuses to sign with an unset or default shared secret.
