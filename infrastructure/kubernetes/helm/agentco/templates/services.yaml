{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentco.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentco.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: {{ .Values.backend.service.protocol }}
  selector:
    {{- include "agentco.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
{{- end }}
{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentco.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentco.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
      protocol: {{ .Values.frontend.service.protocol }}
  selector:
    {{- include "agentco.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
{{- end }}
