{{/*
  AgentCo schema migration job.

  This hook coordinates migrations once per Helm install/upgrade instead of
  letting every backend replica race at startup. It uses a dedicated migration
  DSN secret so runtime pods can keep least-privilege application credentials.
*/}}
{{- if and .Values.backend.enabled .Values.backend.migrationJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agentco.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentco.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.backend.migrationJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.backend.migrationJob.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "agentco.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agentco.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.global.image.registry }}/{{ trimPrefix (printf "%s/" .Values.global.image.registry) .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Values.global.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy | default .Values.global.image.pullPolicy }}
          command: ["node", "dist/db/migrate.js"]
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.migrationJob.existingSecret }}
                  key: {{ .Values.backend.migrationJob.databaseUrlKey }}
          securityContext:
            {{- toYaml .Values.backend.containerSecurityContext | nindent 12 }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
