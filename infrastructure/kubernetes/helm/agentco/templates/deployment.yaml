{{/*
  AgentCo Backend Deployment
  Renders a Kubernetes Deployment for the backend API service.
*/}}
{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentco.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentco.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    {{- with .Values.global.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agentco.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "agentco.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
        {{- with .Values.global.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include "agentco.configChecksum" . | sha256sum }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agentco.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      initContainers:
        # Wait for PostgreSQL to be ready before starting the app.
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "agentco.postgresql.host" . }} 5432; do
                echo "Waiting for PostgreSQL at {{ include "agentco.postgresql.host" . }}:5432..."
                sleep 2
              done
              echo "PostgreSQL is up."
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
        # Wait for Redis to be ready.
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "agentco.redis.host" . }} 6379; do
                echo "Waiting for Redis at {{ include "agentco.redis.host" . }}:6379..."
                sleep 2
              done
              echo "Redis is up."
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: backend
          image: "{{ .Values.global.image.registry }}/{{ trimPrefix (printf "%s/" .Values.global.image.registry) .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Values.global.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy | default .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP
          env:
            # Non-sensitive configuration
            - name: NODE_ENV
              value: {{ .Values.backend.env.NODE_ENV | quote }}
            - name: PORT
              value: {{ .Values.backend.service.targetPort | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.backend.env.LOG_LEVEL | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.backend.env.OTEL_SERVICE_NAME | quote }}
            - name: FRONTEND_URL
              value: {{ printf "https://%s" (index .Values.ingress.hosts 0).host | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://{{ include "agentco.fullname" . }}-otel-collector:4318"
            # Pod identity — useful for structured logging and tracing
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # LLM endpoint (OpenAI-compatible; Ollama by default, no cloud key needed)
            - name: LLM_BASE_URL
              value: {{ .Values.backend.llmBaseUrl | default "http://ollama:11434/v1" | quote }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret }}
                  key: LLM_API_KEY
                  optional: true
            - name: LLM_RESOURCE_ACTOR_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret }}
                  key: LLM_RESOURCE_ACTOR_ID
            - name: LLM_RESOURCE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret }}
                  key: LLM_RESOURCE_ACCOUNT_ID
            - name: EVENT_BUS_DELIVERY_MODE
              value: {{ .Values.backend.eventBusDeliveryMode | default "outbox" | quote }}
            - name: KAFKA_MANDATORY
              value: {{ .Values.backend.kafkaMandatory | default "true" | quote }}
            - name: AGENTCO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret }}
                  key: AGENTCO_API_KEY
            - name: EVENT_BUS_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret }}
                  key: EVENT_BUS_SIGNING_KEY
            - name: EVENT_BUS_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret }}
                  key: EVENT_BUS_HMAC_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret }}
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret }}
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret }}
                  key: REDIS_URL
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret }}
                  key: KAFKA_BROKERS
            - name: PINECONE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret }}
                  key: PINECONE_API_KEY
                  optional: true
            - name: PINECONE_ENVIRONMENT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret }}
                  key: PINECONE_ENVIRONMENT
                  optional: true
            - name: PINECONE_INDEX_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret }}
                  key: PINECONE_INDEX_NAME
                  optional: true
            - name: VAULT_ADDR
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret }}
                  key: VAULT_ADDR
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret }}
                  key: VAULT_TOKEN
            - name: RESERVE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret }}
                  key: RESERVE_SIGNING_KEY
          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.backend.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-cache
              mountPath: /app/.cache
      volumes:
        # Writable scratch space for an otherwise read-only root filesystem
        - name: tmp
          emptyDir: {}
        - name: app-cache
          emptyDir: {}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

{{/*
  ============================================================
  Template helpers (normally in _helpers.tpl — included here
  for completeness when this file is the only template shown)
  ============================================================
*/}}
{{- define "agentco.fullname" -}}
{{- printf "%s-%s" .Release.Name .Chart.Name | trunc 63 | trimSuffix "-" }}
{{- end }}

{{- define "agentco.labels" -}}
helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
{{ include "agentco.selectorLabels" . }}
app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
app.kubernetes.io/managed-by: {{ .Release.Service }}
{{- end }}

{{- define "agentco.selectorLabels" -}}
app.kubernetes.io/name: {{ .Chart.Name }}
app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

{{- define "agentco.serviceAccountName" -}}
{{- if .Values.serviceAccount.create }}
{{- default (include "agentco.fullname" .) .Values.serviceAccount.name }}
{{- else }}
{{- default "default" .Values.serviceAccount.name }}
{{- end }}
{{- end }}

{{- define "agentco.postgresql.host" -}}
{{- if .Values.postgresql.enabled }}
{{- printf "%s-postgresql" (include "agentco.fullname" .) }}
{{- else }}
{{- .Values.externalPostgresql.host }}
{{- end }}
{{- end }}

{{- define "agentco.redis.host" -}}
{{- if .Values.redis.enabled }}
{{- printf "%s-redis-master" (include "agentco.fullname" .) }}
{{- else }}
{{- .Values.externalRedis.host }}
{{- end }}
{{- end }}

{{- define "agentco.configChecksum" -}}
backend:
  nodeEnv: {{ .Values.backend.env.NODE_ENV | quote }}
  port: {{ .Values.backend.service.targetPort | quote }}
  logLevel: {{ .Values.backend.env.LOG_LEVEL | quote }}
  llmBaseUrl: {{ .Values.backend.llmBaseUrl | quote }}
  eventBusDeliveryMode: {{ .Values.backend.eventBusDeliveryMode | default "outbox" | quote }}
  kafkaMandatory: {{ .Values.backend.kafkaMandatory | default "true" | quote }}
frontend:
  nodeEnv: {{ .Values.frontend.env.NODE_ENV | quote }}
  publicApiUrl: {{ .Values.frontend.env.NEXT_PUBLIC_API_URL | quote }}
  apiUrl: {{ .Values.frontend.env.AGENTCO_API_URL | quote }}
{{- end }}
