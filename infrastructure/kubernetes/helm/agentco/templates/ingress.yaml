{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentco.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentco.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ if eq .service.name "backend" }}{{ include "agentco.fullname" $ }}-backend{{ else if eq .service.name "frontend" }}{{ include "agentco.fullname" $ }}-frontend{{ else }}{{ .service.name }}{{ end }}
                port:
                  number: {{ .service.port }}
          {{- end }}
    {{- end }}
{{- end }}
