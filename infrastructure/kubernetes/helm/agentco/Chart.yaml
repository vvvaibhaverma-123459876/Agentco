apiVersion: v2
name: agentco
description: AgentCo autonomous AI company platform
type: application
version: 0.1.0
appVersion: "1.0.0"

keywords:
  - agentco
  - ai-agents
  - autonomous
  - multi-agent

home: https://github.com/agentco/agentco
sources:
  - https://github.com/agentco/agentco

maintainers:
  - name: AgentCo Platform Team
    email: platform@agentco.ai

dependencies:
  - name: postgresql
    version: "14.3.3"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled

  - name: redis
    version: "19.5.5"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled

  - name: kafka
    version: "29.3.4"
    repository: "https://charts.bitnami.com/bitnami"
    condition: kafka.enabled

annotations:
  artifacthub.io/license: MIT
  artifacthub.io/changes: |
    - kind: added
      description: Initial Helm chart release for AgentCo platform
