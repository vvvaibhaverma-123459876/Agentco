---
# ============================================================
# AgentCo Kubernetes Network Policies
# ============================================================
# Default posture: deny all ingress from other namespaces.
# Explicit allow rules are added per-department below.
#
# Requires a CNI plugin that enforces NetworkPolicy
# (Calico, Cilium, Weave, Antrea, etc.)
#
# Apply with: kubectl apply -f network-policies.yaml
# ============================================================

# ------------------------------------------------------------
# DENY ALL cross-namespace ingress (applied to every namespace)
# Each namespace gets a baseline deny-all that blocks ingress
# from pods outside that namespace unless an explicit allow rule
# also matches.
# ------------------------------------------------------------

{% set departments = [
  "agentco-executive",
  "agentco-engineering",
  "agentco-product",
  "agentco-sales",
  "agentco-marketing",
  "agentco-customer-experience",
  "agentco-people-ops",
  "agentco-legal",
  "agentco-design",
  "agentco-infrastructure"
] %}

# ---- agentco-executive: deny-all baseline ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: agentco-executive
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
