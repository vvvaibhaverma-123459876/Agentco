---
# ============================================================
# ALLOW all department namespaces → Kafka (port 9092)
# in agentco-infrastructure
# ============================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-department-agents-to-kafka
  namespace: agentco-infrastructure
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: agentco/department
                operator: In
                values:
                  - executive
                  - engineering
                  - product
                  - sales
                  - marketing
                  - customer-experience
                  - people-ops
                  - legal
                  - design
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 29092

---
