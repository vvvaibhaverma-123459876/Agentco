---
# ============================================================
# AgentCo Kubernetes Namespaces
# ============================================================
# Each department runs in its own namespace for isolation,
# resource governance, and network policy enforcement.
# Apply with: kubectl apply -f namespaces.yaml
# ============================================================

# ------------------------------------------------------------
# Executive
# ------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: agentco-executive
  labels:
    app.kubernetes.io/part-of: agentco
    agentco/department: executive
    agentco/tier: control-plane
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: executive-quota
  namespace: agentco-executive
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
    services: "10"
    persistentvolumeclaims: "5"
    secrets: "30"
    configmaps: "20"
---

