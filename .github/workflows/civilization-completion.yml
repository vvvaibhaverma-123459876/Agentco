name: civilization-completion

# Runs the civilization backend test suites and the completion reconciliation
# gate on the civilization branch and on pull requests that touch the layer.
on:
  push:
    branches: [feature/civilization-layer, main]
  pull_request:
    paths:
      - 'backend/src/services/civilization-**'
      - 'backend/src/services/*-os.service.ts'
      - 'backend/src/db/migrations/1[23][0-9]_*.sql'
      - 'backend/tests/civilization-**'
      - 'CIVILIZATION_BUILD_LEDGER.yaml'
      - 'scripts/generate_civilization_completion.py'

jobs:
  civilization-suite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentco
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agentco
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentco -d agentco"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://agentco:password@localhost:5432/agentco
      AGENTCO_TEST_DATABASE_URL: postgresql://agentco:password@localhost:5432/agentco
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend dependencies
        run: cd backend && npm ci
      - name: Apply migrations
        run: cd backend && npm run db:migrate
      - name: TypeScript check
        run: cd backend && npx tsc --noEmit
      - name: Run civilization test suites
        run: make civilization-suite
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: Completion reconciliation gate
        run: make civilization-completion
      - name: Upload completion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civilization-completion-evidence
          path: reports/civilization_completion/latest/
