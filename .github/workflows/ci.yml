name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'claude/**']

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for committed secrets
        run: |
          set -euo pipefail
          openai_prefix='s''k-'
          private_key='BEGIN (RSA|OPENSSH|EC|DSA)? ?PRIVATE KEY'
          bad_jwt='JWT_SECRET=(change-me|[A-Za-z0-9]{16,})'
          bad_api_key='AGENTCO_API_KEY=dev''-api-key'
          pattern="${openai_prefix}[A-Za-z0-9_-]{20,}|${private_key}|${bad_jwt}|${bad_api_key}"
          if git grep -n -E "$pattern" -- ':!*.md' ':!docs/**' ':!reports/**' ':!**/tests/**' ':!node_modules/**'; then
            echo "Potential committed secret or production-dangerous default found"
            exit 1
          fi

  test-agents:
    name: Python Agent Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements/requirements.lock.txt

      - name: Install dependencies
        run: pip install -r requirements/requirements.lock.txt

      - name: Run tests
        env:
          # Local-first: tests mock the LLM, but the client reads these at import.
          LLM_BASE_URL: http://localhost:11434/v1
          LLM_API_KEY: test
        run: |
          cd agents
          pytest tests/ -v --cov=core --cov=executive --cov=engineering --cov-report=term-missing

  test-backend:
    name: TypeScript Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentco
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agentco
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentco -d agentco"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://agentco:password@localhost:5432/agentco
        run: npm run db:migrate

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://agentco:password@localhost:5432/agentco
        run: npm run test:all

  master-gate:
    name: Release Credibility Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentco
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agentco
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentco -d agentco"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements/requirements.lock.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Install Python dependencies
        run: pip install -r requirements/requirements.lock.txt

      - name: Verify pytest collection
        run: PYTHONDONTWRITEBYTECODE=1 python3.13 -m pytest --collect-only -q

      - name: Prepare release gate database role
        env:
          DATABASE_URL: postgresql://agentco:password@localhost:5432/agentco
        run: |
          cd backend
          npm ci
          npm run db:migrate
          cd ..
          psql "$DATABASE_URL" \
            -v gate_role=agentco_gate \
            -v gate_password=gate_password \
            -f scripts/setup_release_gate_role.sql

      - name: Run release credibility gate
        env:
          DATABASE_URL: postgresql://agentco_gate:gate_password@localhost:5432/agentco
          AGENTCO_TEST_DATABASE_URL: postgresql://agentco_gate:gate_password@localhost:5432/agentco
          RELEASE_GATE_DATABASE_URL: postgresql://agentco_gate:gate_password@localhost:5432/agentco
          RELEASE_GATE_MIGRATION_DATABASE_URL: postgresql://agentco:password@localhost:5432/agentco
          RELEASE_GATE_SETUP_DATABASE_URL: postgresql://agentco:password@localhost:5432/agentco
          RELEASE_GATE_ROLE: agentco_gate
          RELEASE_GATE_ROLE_PASSWORD: gate_password
        run: make release-gate

  test-frontend:
    name: Next.js Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint
