name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'claude/**', 'codex/**']

jobs:
  offline-gate:
    name: Offline Civilization Gate
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://agentco:password@localhost:5432/agentco
      SUPERUSER_DATABASE_URL: postgresql://agentco:password@localhost:5432/agentco
      RESOLUTION_SERVICE_PASSWORD: resolution-service-dev-password
      LLM_PROVIDER: offline
      LLM_API_KEY: test
      AGENTCO_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agents/requirements.txt
          pip install beautifulsoup4 requests pandas numpy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start integration services
        run: docker compose --profile dev up -d postgres zookeeper kafka

      - name: Doctor
        run: make doctor

      - name: Offline smoke
        run: make smoke

      - name: Offline civilization demo
        run: make demo

      - name: Docker compose minimal profile check
        run: docker compose --profile minimal config --services | tee /tmp/agentco-compose-services.txt && grep -qx postgres /tmp/agentco-compose-services.txt

      - name: Migration test
        run: make migrate

      - name: Python calibration and civilization tests
        run: python -m pytest calibration runtime reserve tests evals learning synthesis

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Frontend build
        working-directory: frontend
        run: npm test && npm run build

      - name: Full make test gate
        run: make test
