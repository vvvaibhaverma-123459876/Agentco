name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'claude/**']

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Scan for committed secrets
        run: python3 scripts/scan_committed_secrets.py --check

  test-agents:
    name: Python Agent Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements/requirements.lock.txt

      - name: Install dependencies
        run: pip install -r requirements/requirements.lock.txt

      - name: Run tests
        env:
          # Local-first: tests mock the LLM, but the client reads these at import.
          LLM_BASE_URL: http://localhost:11434/v1
          LLM_API_KEY: test
        run: PYTHONDONTWRITEBYTECODE=1 python3.13 scripts/verify_pytest_skips.py --report artifacts/ci/python-pytest-report.json --summary-output artifacts/ci/python-pytest-summary.json -- -q

  test-backend:
    name: TypeScript Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentco
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agentco
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentco -d agentco"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      zookeeper:
        image: confluentinc/cp-zookeeper:7.6.1
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports:
          - 2181:2181
      kafka:
        image: confluentinc/cp-kafka:7.6.1
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports:
          - 9092:9092
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements/requirements.lock.txt

      - name: Install Python dependencies
        run: pip install -r requirements/requirements.lock.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://agentco:password@localhost:5432/agentco
        run: npm run db:migrate

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://agentco:password@localhost:5432/agentco
          AGENTCO_TEST_DATABASE_URL: postgresql://agentco:password@localhost:5432/agentco
          KAFKA_BROKERS: localhost:9092
          PYTHONPATH: ${{ github.workspace }}
          AGENTCO_PYTHON: python3.13
        run: npm run test:all

  master-gate:
    name: Release Credibility Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentco
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agentco
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentco -d agentco"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements/requirements.lock.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Install Python dependencies
        run: pip install -r requirements/requirements.lock.txt

      - name: Verify pytest collection
        run: PYTHONDONTWRITEBYTECODE=1 python3.13 -m pytest --collect-only -q

      - name: Prepare release gate database role
        env:
          DATABASE_URL: postgresql://agentco:password@localhost:5432/agentco
        run: |
          cd backend
          npm ci
          npm run db:migrate
          cd ..
          psql "$DATABASE_URL" \
            -v gate_role=agentco_gate \
            -v gate_password=gate_password \
            -f scripts/setup_release_gate_role.sql

      - name: Run release credibility gate
        env:
          DATABASE_URL: postgresql://agentco_gate:gate_password@localhost:5432/agentco
          AGENTCO_TEST_DATABASE_URL: postgresql://agentco_gate:gate_password@localhost:5432/agentco
          RELEASE_GATE_DATABASE_URL: postgresql://agentco_gate:gate_password@localhost:5432/agentco
          RELEASE_GATE_MIGRATION_DATABASE_URL: postgresql://agentco:password@localhost:5432/agentco
          RELEASE_GATE_SETUP_DATABASE_URL: postgresql://agentco:password@localhost:5432/agentco
          RELEASE_GATE_ROLE: agentco_gate
          RELEASE_GATE_ROLE_PASSWORD: gate_password
        run: make release-gate

  test-frontend:
    name: Next.js Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint
