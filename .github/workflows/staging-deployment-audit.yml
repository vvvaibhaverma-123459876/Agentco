name: Staging Deployment Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'audit/**'
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infrastructure/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/staging-deployment-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infrastructure/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/staging-deployment-audit.yml'

permissions:
  contents: read

concurrency:
  group: staging-deployment-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-deployment:
    name: Local Kubernetes staging audit
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record expected audit commit
        run: echo "EXPECTED_AUDIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements/requirements.lock.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Install Python dependencies
        run: pip install -r requirements/requirements.lock.txt

      - name: Verify Docker access
        run: docker info

      - name: Run local Kubernetes staging audit
        run: make audit-staging-deployment

      - name: Verify staging audit evidence commit
        run: |
          python3.13 - <<'PY'
          import json
          import os
          from pathlib import Path

          head = os.environ["EXPECTED_AUDIT_SHA"]
          ledgers = sorted(Path("artifacts/staging-deployment").glob("*/EXECUTION_LEDGER.json"))
          if not ledgers:
              raise SystemExit("missing staging deployment execution ledger")
          ledger = json.loads(ledgers[-1].read_text())
          if ledger.get("commit") != head:
              raise SystemExit(f"ledger commit {ledger.get('commit')} does not match workflow SHA {head}")
          if ledger.get("final_verdict") != "PASS":
              raise SystemExit(f"staging audit verdict is {ledger.get('final_verdict')}")
          if not ledger.get("cleanup", {}).get("success"):
              raise SystemExit("staging cleanup did not verify success")
          PY

      - name: Upload staging deployment audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-deployment-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/staging-deployment/**
          if-no-files-found: error
