name: Clean-Room Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'Makefile'
      - '.github/workflows/**'
      - 'backend/**'
      - 'frontend/**'
      - 'agents/**'
      - 'runtime/**'
      - 'learning/**'
      - 'synthesis/**'
      - 'evals/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements/**'
      - 'docker-compose*.yml'
      - 'Dockerfile*'
      - 'infrastructure/**'
      - 'docs/audit/current/**'
  push:
    branches: [main, 'audit/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-room-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-clean-room:
    name: Local clean-room audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements/requirements.lock.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements/requirements.lock.txt

      - name: Run isolated clean-room audit
        run: make audit-clean-room

      - name: Upload clean-room audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-room-audit-${{ github.sha }}
          path: artifacts/audit/
          if-no-files-found: warn
