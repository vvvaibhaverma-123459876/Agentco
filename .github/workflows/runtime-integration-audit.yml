name: Runtime Integration Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'audit/**'
    paths:
      - 'backend/**'
      - 'agents/**'
      - 'runtime/**'
      - 'learning/**'
      - 'synthesis/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/runtime-integration-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'agents/**'
      - 'runtime/**'
      - 'learning/**'
      - 'synthesis/**'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/runtime-integration-audit.yml'

concurrency:
  group: runtime-integration-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-integration:
    name: Local runtime integration audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements/requirements.lock.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Install Python dependencies
        run: pip install -r requirements/requirements.lock.txt

      - name: Run isolated runtime integration audit
        run: make audit-runtime-integration

      - name: Upload runtime integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-integration-${{ github.sha }}
          path: artifacts/runtime-integration/**
          if-no-files-found: error
