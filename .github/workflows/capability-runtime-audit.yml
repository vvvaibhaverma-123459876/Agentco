name: Capability Runtime Audit

on:
  pull_request:
    branches: [audit/remediation-07-cross-version-civilization-evaluation, main]
    paths:
      - "agentco_capability/**"
      - "backend/src/routes/capabilities.routes.ts"
      - "backend/src/services/capability-runtime.service.ts"
      - "backend/src/types/capability.types.ts"
      - "backend/src/db/migrations/140_governed_capability_runtime.sql"
      - "schemas/agentco_capability_*.schema.json"
      - "scripts/run_governed_capability_genesis.py"
      - "tests/test_capability_runtime.py"
      - "backend/tests/capability-runtime.test.ts"
      - "Makefile"
  workflow_dispatch:
    inputs:
      mode:
        description: "Genesis V2 mode"
        required: true
        default: "protocol-reference"
        type: choice
        options:
          - protocol-reference
          - real-capability-provider
      provider:
        description: "Optional provider id for real-capability-provider mode"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: capability-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capability-runtime:
    name: Capability runtime audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_AUDIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GENESIS_MODE: ${{ github.event.inputs.mode || 'protocol-reference' }}
      GENESIS_PROVIDER: ${{ github.event.inputs.provider || '' }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements/requirements.lock.txt

      - name: Install locked Python dependencies
        run: python3.13 -m pip install -r requirements/requirements.lock.txt

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_AUDIT_SHA"

      - name: Capability runtime Python tests
        run: python3.13 -m pytest tests/test_capability_runtime.py -q

      - name: Capability runtime backend tests
        run: cd backend && npm test -- capability-runtime.test.ts --runInBand

      - name: Backend build
        run: cd backend && npm run build

      - name: Capability genesis V2 campaign
        run: |
          if [ -n "$GENESIS_PROVIDER" ]; then
            python3.13 scripts/run_governed_capability_genesis.py --mode "$GENESIS_MODE" --provider "$GENESIS_PROVIDER"
          else
            python3.13 scripts/run_governed_capability_genesis.py --mode "$GENESIS_MODE"
          fi

      - name: Verify genesis commit binding
        run: |
          python3.13 - <<'PY'
          import json
          import os
          from pathlib import Path
          mode = os.environ["GENESIS_MODE"]
          manifest_path = Path("artifacts/capability-runtime") / f"governed-capability-genesis-v2-{mode}" / "GENESIS_V2_MANIFEST.json"
          manifest = json.loads(manifest_path.read_text())
          if manifest["campaign_execution_sha"] != os.environ["EXPECTED_AUDIT_SHA"]:
              raise SystemExit("genesis manifest SHA does not match workflow head")
          if mode == "protocol-reference" and manifest["decision"] != "PROTOCOL_BASELINE_ACCEPTED":
              raise SystemExit("protocol-reference genesis did not pass")
          if mode == "real-capability-provider" and manifest["decision"] not in {"CAPABILITY_GENESIS_ACCEPTED", "HOLD_FOR_MORE_EVIDENCE"}:
              raise SystemExit("real-capability-provider genesis did not produce a valid decision")
          PY

      - name: Upload capability runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/capability-runtime/**
            docs/audit/current/GOVERNED_CAPABILITY_GENESIS_V1_INVALIDATION.*
            docs/audit/current/GOVERNED_CAPABILITY_GENESIS_V2_*
          if-no-files-found: warn
          retention-days: 120
