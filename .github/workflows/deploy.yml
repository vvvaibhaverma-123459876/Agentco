name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: []
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" > kubeconfig.yaml

      - name: Build and push backend image
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/backend:${{ github.sha }}
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"

      - name: Build and push frontend image
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/frontend:${{ github.sha }}
          docker build -t "$IMAGE" ./frontend
          docker push "$IMAGE"

      - name: Deploy via Helm
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          helm upgrade --install agentco infrastructure/kubernetes/helm/agentco \
            --kubeconfig kubeconfig.yaml \
            --set backend.image.repository=ghcr.io/${REPO}/backend \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.repository=ghcr.io/${REPO}/frontend \
            --set frontend.image.tag=${{ github.sha }} \
            --namespace agentco \
            --wait
