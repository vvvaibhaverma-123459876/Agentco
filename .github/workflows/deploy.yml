name: Deploy

# Deploy does NOT run on every push. There is no standing production cluster,
# so running it on push only produces red builds. It runs only when explicitly
# requested (manual dispatch) or when a release tag is pushed.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write   # required to push images to GitHub Container Registry

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Verify deploy secrets are present
        run: |
          if [ -z "${{ secrets.KUBECONFIG }}" ]; then
            echo "::error::KUBECONFIG secret is not set. Configure deploy secrets before running this workflow."
            exit 1
          fi

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" > kubeconfig.yaml

      - name: Build and push backend image
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/backend:${{ github.sha }}
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"

      - name: Build and push frontend image
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/frontend:${{ github.sha }}
          docker build -t "$IMAGE" ./frontend
          docker push "$IMAGE"

      - name: Deploy via Helm
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          helm upgrade --install agentco infrastructure/kubernetes/helm/agentco \
            --kubeconfig kubeconfig.yaml \
            --set backend.image.repository=ghcr.io/${REPO}/backend \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.repository=ghcr.io/${REPO}/frontend \
            --set frontend.image.tag=${{ github.sha }} \
            --namespace agentco \
            --wait
